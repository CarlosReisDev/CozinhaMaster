<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Cardápio — Cozinha Master</title>
  <meta name="description" content="Conheça o cardápio completo da Cozinha Master. Hambúrgueres artesanais, combos, bebidas e extras." />
  <link rel="icon" href="assets/images/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/cardapio.css" />
</head>
<body>

  <!-- ── NOISE OVERLAY ── -->
  <div class="noise-overlay" aria-hidden="true"></div>

  <!-- ── NAVBAR ── -->
  <header class="site-header visible" id="site-header">
    <nav class="navbar-pill">
      <a href="index.html" class="navbar-logo">
        <img src="assets/images/Logo.png" alt="Cozinha Master" />
      </a>
      <ul class="navbar-links">
        <li><a href="index.html#sobre">Nossa História</a></li>
      </ul>
      <a href="cardapio.html" class="navbar-cta nav-active">Cardápio</a>
    </nav>
  </header>

  <!-- ── HERO HEADER ── -->
  <section class="cardapio-hero">
    <div class="cardapio-hero-inner">
      <span class="cardapio-label">006 / Cardápio</span>
      <h1 class="cardapio-title">
        O que vai<br />
        <em>ser hoje?</em>
      </h1>
      <p class="cardapio-subtitle">
        Ingredientes selecionados. Preparo artesanal.<br />
        <span class="cardapio-subtitle-mono">Blend Exclusivo&nbsp;&nbsp;·&nbsp;&nbsp;Pão Brioche&nbsp;&nbsp;·&nbsp;&nbsp;Sem Concessões</span>
      </p>
    </div>
  </section>

  <!-- ── FILTER TABS (populado dinamicamente pelo JS) ── -->
  <div class="filter-bar">
    <div class="filter-tabs" id="filter-tabs">
      <button class="filter-tab active" data-filter="all">Tudo</button>
    </div>
    <span class="filter-count" id="filter-count">—</span>
  </div>

  <!-- ── MENU WRAP (populado dinamicamente pelo JS) ── -->
  <main class="menu-wrap" id="menu-wrap"></main>

  <!-- ── FOOTER CTA ── -->
  <section class="cardapio-footer-cta">
    <div class="cardapio-footer-inner">
      <p class="footer-cta-text">Ficou alguma dúvida?</p>
      <a href="#" class="cta-button cta-button--primary wa-link" target="_blank" rel="noopener">
          Fale conosco pelo WhatsApp
      </a>
    </div>
    <p class="footer-cta-meta"><span data-cfg="hours_evening">Qua–Dom: 16h–23h</span>&nbsp;&nbsp;·&nbsp;&nbsp;<span data-cfg="address_line1">Av. Palmeiras, 463</span></p>
  </section>

  <script src="js/config.js"></script>
  <script src="js/site-config.js"></script>
  <script src="js/cardapio.js"></script>
</body>
</html>
